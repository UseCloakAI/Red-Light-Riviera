<!doctype html><html><head><meta charset="utf-8"><title>Car lab</title>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.min.js", "three/addons/": "../../vendor/three/addons/" } }</script>
<style>html,body{margin:0;background:#222}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from "three";
import { MODELS, buildModel, bodyMaterial, glassMaterial, wheelGeometry, wheelMaterial, pickPaint } from "../../game/carmodels.js";
const W = 1600, H = 900, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color("#7a8494");
sc.add(new THREE.HemisphereLight(0xdde6ff, 0x554433, 1.4)); const d = new THREE.DirectionalLight(0xfff0dd, 2.2); d.position.set(4, 6, 3); sc.add(d);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x55585c })); sc.add(fl);
const cars = []; const rnd = Math.random;
MODELS.forEach((m, i) => {
  const B = buildModel(m), g = new THREE.Group(), bm = bodyMaterial(false); bm.userData.u.uPaint.value.set(pickPaint(m, rnd));
  g.add(new THREE.Mesh(B.body, bm), new THREE.Mesh(B.glass, glassMaterial()), new THREE.Mesh(B.door, bm), new THREE.Mesh(B.doorGlass, glassMaterial()));
  for (const [x, z] of B.wheels) { const w = new THREE.Mesh(wheelGeometry(), wheelMaterial()); w.scale.setScalar(m.wheelR); w.position.set(x, m.wheelR, z); g.add(w); }
  g.position.set((i % 4) * 6 - 9, 0, Math.floor(i / 4) * 7 - 3.5); g.rotation.y = 0.9; sc.add(g); cars.push(g);
});
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
window.shot = (k) => { const v = [[0, 9, 22], [18, 6, 10], [-16, 4, -14], [2, 22, 2]][k]; cam.position.set(...v); cam.lookAt(0, 0.6, 0); r.render(sc, cam); return r.domElement.toDataURL("image/jpeg", 0.88); };
window.close = (i, v) => { const g = cars[i]; cam.position.set(g.position.x + v[0], v[1], g.position.z + v[2]); cam.lookAt(g.position.x, 0.8, g.position.z); r.render(sc, cam); return r.domElement.toDataURL("image/jpeg", 0.88); };
window.READY = true;
</script></body></html>
