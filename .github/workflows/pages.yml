name: Deploy Lowtide to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["lowtide/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout): the deploy
  # job starts after the artifact is registered, so it never races the upload.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # stamp this build on every script, style and module URL so a page load never mixes versions
      - name: Version asset URLs
        run: |
          V="${GITHUB_SHA::8}"
          grep -rlZ --include='*.html' --include='*.js' --include='*.css' '?v=dev' lowtide | xargs -0 -r sed -i "s/?v=dev/?v=$V/g"
          echo "stamped $V"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lowtide

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
